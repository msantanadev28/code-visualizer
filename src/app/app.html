<div class="h-screen w-screen bg-neutral-900 text-neutral-100 flex flex-col font-sans overflow-hidden">
  <header class="h-14 bg-neutral-950 border-b border-neutral-800 flex items-center justify-between px-6 shadow-md z-10 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <h1 class="text-lg font-bold bg-gradient-to-r from-emerald-400 to-teal-400 text-transparent bg-clip-text">
        Code Visualizer
      </h1>
    </div>
    
    <div class="flex items-center gap-4 text-sm">
      <div class="flex bg-neutral-900 rounded-lg p-1 border border-neutral-800">
        <button [class]="getLayoutClass('dagre')" (click)="setLayout('dagre')">Tree</button>
        <button [class]="getLayoutClass('breadthfirst')" (click)="setLayout('breadthfirst')">Breadth</button>
        <button [class]="getLayoutClass('circle')" (click)="setLayout('circle')">Circle</button>
      </div>
    </div>
  </header>

  <main class="flex-grow flex flex-col md:flex-row gap-4 p-4 overflow-hidden">
    <!-- Left panel (editor) -->
    <div class="w-full md:w-1/4 h-1/2 md:h-full shrink-0 min-w-[300px]">
      <app-json-editor></app-json-editor>
    </div>

    <!-- Center panel (graph) -->
    <div class="flex-grow h-1/2 md:h-full relative min-w-0">
      <app-graph-canvas></app-graph-canvas>
      
      <div class="absolute bottom-4 left-4 flex gap-2">
        <div class="bg-neutral-950/80 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-neutral-700/50 text-xs text-neutral-400 shadow-lg">
          Scroll to zoom &bull; Drag to pan &bull; Click node to inspect
        </div>
      </div>
    </div>

    <!-- Right panel (details) -->
    <div class="w-full md:w-1/4 h-1/2 md:h-full shrink-0 min-w-[300px]">
      <app-node-details></app-node-details>
    </div>
  </main>
</div>
